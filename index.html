<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos Avanzado</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#6366f1">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding: 20px 12px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; }

        header { text-align: center; margin-bottom: 24px; }
        header h1 { font-size: 1.5rem; color: var(--primary-dark); font-weight: 700; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); padding: 14px; border-radius: 14px; border: 1px solid var(--border); }
        .stat-card.full-width { grid-column: span 2; background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .stat-card.full-width .stat-label { color: white; opacity: 0.9; }
        .stat-value { font-size: 1.25rem; font-weight: 700; margin-top: 4px; }
        .stat-card.full-width .stat-value { font-size: 1.75rem; }

        .card { background-color: var(--card-bg); padding: 18px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px; }
        .card h3 { font-size: 1rem; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .form-group { margin-bottom: 12px; }
        .form-group.full { grid-column: span 2; }
        label { display: block; font-size: 0.78rem; font-weight: 600; margin-bottom: 4px; color: var(--text-muted); }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; outline: none; background: #fff; }
        input:focus, select:focus { border-color: var(--primary); }

        /* Clase esencial para ocultar los campos de tarjeta por defecto */
        .hidden { display: none !important; }

        .btn-primary { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
        .btn-primary:active { background-color: var(--primary-dark); }

        .expense-item { background: #fff; border: 1px solid var(--border); border-left: 5px solid var(--danger); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
        .expense-item.paid { border-left-color: var(--success); }
        .expense-item.partial { border-left-color: var(--warning); }
        .expense-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .expense-title { font-weight: 700; font-size: 0.95rem; }
        .expense-category { font-size: 0.7rem; background: #f1f5f9; padding: 2px 8px; border-radius: 6px; color: var(--text-muted); }
        .expense-body { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 10px; line-height: 1.4; }
        
        .actions { display: flex; gap: 6px; margin-top: 8px; }
        .actions button { flex: 1; padding: 7px; font-size: 0.75rem; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; color: white; }
        .btn-success { background-color: var(--success); }
        .btn-warning { background-color: var(--warning); }
        .btn-danger { background-color: var(--danger); }
        .empty-state { text-align: center; padding: 24px; color: var(--text-muted); font-size: 0.85rem; }

        .stats-box { font-size: 0.85rem; color: var(--text-muted); }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Control de Gastos</h1>
    </header>

    <div class="dashboard-grid">
        <div class="stat-card full-width">
            <div class="stat-label">Total Mes Ingresado</div>
            <div class="stat-value" id="lblTotal">$0.00</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total Pagado</div>
            <div class="stat-value" id="lblPaid" style="color: var(--success);">$0.00</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Restante a Pagar</div>
            <div class="stat-value" id="lblRemaining" style="color: var(--danger);">$0.00</div>
        </div>
    </div>

    <!-- Panel de Estadísticas y Resumen por Categoría -->
    <div class="card">
        <h3><i class="fa-solid fa-chart-pie" style="color:var(--primary)"></i> Resumen por Categoría</h3>
        <div id="statsContainer" class="stats-box">
            <div class="empty-state">Sin datos para calcular.</div>
        </div>
    </div>

    <div class="card">
        <h3><i class="fa-solid fa-circle-plus" style="color:var(--primary)"></i> Nuevo Gasto</h3>
        <form id="expenseForm">
            <div class="form-group full">
                <label for="name">Concepto</label>
                <input type="text" id="name" required placeholder="Ej: Alquiler, Visa, Supermercado">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="category">Categoría</label>
                    <select id="category" onchange="toggleCardFields()">
                        <option value="Alquiler">Alquiler</option>
                        <option value="Impuesto">Impuesto</option>
                        <option value="Creditos">Creditos</option>
                        <option value="Tarjetas">Tarjetas</option>
                        <option value="Otros" selected>Otros</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="totalAmount">Monto Total ($)</label>
                    <input type="number" step="0.01" id="totalAmount" required placeholder="0.00">
                </div>
            </div>

            <!-- Campos exclusivos para Tarjetas (Ocultos por defecto) -->
            <div id="cardFields" class="hidden">
                <div class="form-row">
                    <div class="form-group">
                        <label for="minAmount">Pago Mínimo ($)</label>
                        <input type="number" step="0.01" id="minAmount" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="customPayAmount">Monto a Abonar ($)</label>
                        <input type="number" step="0.01" id="customPayAmount" placeholder="0.00">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-primary">Registrar Gasto</button>
        </form>
    </div>

    <div class="card">
        <h3><i class="fa-solid fa-list-check" style="color:var(--primary)"></i> Mis Gastos</h3>
        <div id="expensesList"></div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'expenses_v3_advanced';

    function toggleCardFields() {
        const category = document.getElementById('category').value;
        const cardFields = document.getElementById('cardFields');
        if (category === 'Tarjetas') {
            cardFields.classList.remove('hidden');
        } else {
            cardFields.classList.add('hidden');
            document.getElementById('minAmount').value = '';
            document.getElementById('customPayAmount').value = '';
        }
    }

    const expenseForm = document.getElementById('expenseForm');
    expenseForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const category = document.getElementById('category').value;
        const totalAmount = parseFloat(document.getElementById('totalAmount').value);
        
        let minAmount = 0;
        let paidAmount = 0;

        if (category === 'Tarjetas') {
            minAmount = parseFloat(document.getElementById('minAmount').value) || 0;
            const customPay = parseFloat(document.getElementById('customPayAmount').value);
            if (!isNaN(customPay)) {
                paidAmount = customPay;
            }
        }

        const newExpense = {
            id: Date.now().toString(),
            name,
            category,
            totalAmount,
            minAmount,
            paidAmount
        };

        let expenses = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        expenses.unshift(newExpense);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));

        expenseForm.reset();
        toggleCardFields();
        document.getElementById('name').focus();
        loadExpenses();
    });

    function loadExpenses() {
        let expenses = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        renderApp(expenses);
    }

    function renderApp(expenses) {
        const expensesList = document.getElementById('expensesList');
        const lblTotal = document.getElementById('lblTotal');
        const lblPaid = document.getElementById('lblPaid');
        const lblRemaining = document.getElementById('lblRemaining');
        const statsContainer = document.getElementById('statsContainer');

        expensesList.innerHTML = '';

        let total = 0;
        let paid = 0;
        let catTotals = { Alquiler: 0, Impuesto: 0, Creditos: 0, Tarjetas: 0, Otros: 0 };

        if (expenses.length === 0) {
            expensesList.innerHTML = '<div class="empty-state">No hay registros cargados.</div>';
            statsContainer.innerHTML = '<div class="empty-state">Sin datos para calcular.</div>';
            lblTotal.textContent = '$0.00';
            lblPaid.textContent = '$0.00';
            lblRemaining.textContent = '$0.00';
            return;
        }

        expenses.forEach(exp => {
            total += exp.totalAmount;
            paid += exp.paidAmount;
            if (catTotals[exp.category] !== undefined) {
                catTotals[exp.category] += exp.totalAmount;
            }

            const remaining = exp.totalAmount - exp.paidAmount;
            let statusClass = '';
            let payButtonText = 'Pagar Total';

            if (exp.paidAmount >= exp.totalAmount) {
                statusClass = 'paid';
                payButtonText = 'Desmarcar';
            } else if (exp.paidAmount > 0) {
                statusClass = 'partial';
                payButtonText = 'Completar Pago';
            }

            let cardExtraInfo = '';
            if (exp.category === 'Tarjetas') {
                cardExtraInfo = `<br>Mínimo: <b>$${exp.minAmount.toFixed(2)}</b>`;
            }

            const div = document.createElement('div');
            div.className = `expense-item ${statusClass}`;
            div.innerHTML = `
                <div class="expense-header">
                    <span class="expense-title">${exp.name}</span>
                    <span class="expense-category">${exp.category}</span>
                </div>
                <div class="expense-body">
                    Total: <b>$${exp.totalAmount.toFixed(2)}</b> | Pagado: <b>$${exp.paidAmount.toFixed(2)}</b>
                    ${cardExtraInfo}<br>
                    Restante: <b>$${remaining.toFixed(2)}</b>
                </div>
                <div class="actions">
                    <button class="btn-success" onclick="togglePay('${exp.id}')">${payButtonText}</button>
                    ${exp.category === 'Tarjetas' ? `<button class="btn-warning" onclick="payMin('${exp.id}')">Pagar Mín.</button>` : ''}
                    <button class="btn-danger" onclick="deleteExpense('${exp.id}')">Eliminar</button>
                </div>
            `;
            expensesList.appendChild(div);
        });

        lblTotal.textContent = `$${total.toFixed(2)}`;
        lblPaid.textContent = `$${paid.toFixed(2)}`;
        lblRemaining.textContent = `$${(total - paid).toFixed(2)}`;

        // Renderizar estadísticas por categoría
        statsContainer.innerHTML = '';
        for (let cat in catTotals) {
            if (catTotals[cat] > 0) {
                const row = document.createElement('div');
                row.className = 'stat-row';
                row.innerHTML = `<span><b>${cat}:</b></span> <span>$${catTotals[cat].toFixed(2)}</span>`;
                statsContainer.appendChild(row);
            }
        }
        if (statsContainer.innerHTML === '') {
            statsContainer.innerHTML = '<div class="empty-state">Sin gastos asignados en categorías.</div>';
        }
    }

    function togglePay(id) {
        let expenses = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        expenses = expenses.map(exp => {
            if (exp.id === id) {
                if (exp.paidAmount >= exp.totalAmount) {
                    exp.paidAmount = 0;
                } else {
                    exp.paidAmount = exp.totalAmount;
                }
            }
            return exp;
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
        loadExpenses();
    }

    function payMin(id) {
        let expenses = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        expenses = expenses.map(exp => {
            if (exp.id === id) {
                exp.paidAmount = exp.minAmount;
            }
            return exp;
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
        loadExpenses();
    }

    function deleteExpense(id) {
        if (confirm('¿Eliminar este gasto?')) {
            let expenses = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            expenses = expenses.filter(exp => exp.id !== id);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
            loadExpenses();
        }
    }

    loadExpenses();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Financiero por Usuario</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#6366f1">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding: 20px 12px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; }
        .hidden { display: none !important; }

        #auth-screen {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
            text-align: center;
            margin-top: 40px;
        }
        #auth-screen h2 { margin-bottom: 16px; color: var(--primary-dark); }

        header { text-align: center; margin-bottom: 24px; }
        header h1 { font-size: 1.5rem; color: var(--primary-dark); font-weight: 700; }
        
        .user-bar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 16px; font-size: 0.85rem; }
        .user-bar button { background: none; border: none; color: var(--danger); cursor: pointer; font-weight: 600; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); padding: 14px; border-radius: 14px; border: 1px solid var(--border); }
        .stat-card.full-width { grid-column: span 2; background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .stat-card.full-width .stat-label { color: white; opacity: 0.9; }
        .stat-value { font-size: 1.25rem; font-weight: 700; margin-top: 4px; }
        .stat-card.full-width .stat-value { font-size: 1.75rem; }

        .card { background-color: var(--card-bg); padding: 18px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px; }
        .card h3 { font-size: 1rem; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .form-group { margin-bottom: 12px; }
        .form-group.full { grid-column: span 2; }
        label { display: block; font-size: 0.78rem; font-weight: 600; margin-bottom: 4px; color: var(--text-muted); }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; outline: none; }
        input:focus, select:focus { border-color: var(--primary); }

        .btn-primary { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
        .btn-primary:active { background-color: var(--primary-dark); }

        .expense-item { background: #fff; border: 1px solid var(--border); border-left: 5px solid var(--danger); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
        .expense-item.paid { border-left-color: var(--success); }
        .expense-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .expense-title { font-weight: 700; font-size: 0.95rem; }
        .expense-category { font-size: 0.7rem; background: #f1f5f9; padding: 2px 8px; border-radius: 6px; color: var(--text-muted); }
        .expense-body { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 10px; }
        .actions { display: flex; gap: 6px; }
        .actions button { flex: 1; padding: 7px; font-size: 0.75rem; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; color: white; }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: #ef4444; }
        .empty-state { text-align: center; padding: 24px; color: var(--text-muted); font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="container">
    <!-- Pantalla de Login / Registro Local por Usuario -->
    <div id="auth-screen">
        <h2>Iniciar Sesión</h2>
        <form id="authForm">
            <div class="form-group full">
                <label for="authEmail">Nombre de Usuario o Correo</label>
                <input type="text" id="authEmail" required placeholder="Ej: marco o tu@correo.com">
            </div>
            <div class="form-group full">
                <label for="authPass">Contraseña</label>
                <input type="password" id="authPass" required placeholder="******">
            </div>
            <button type="submit" class="btn-primary">Entrar / Registrarse</button>
        </form>
    </div>

    <!-- Pantalla Principal de la App -->
    <div id="app-screen" class="hidden">
        <header>
            <h1>Control Financiero</h1>
            <div class="user-bar">
                <span id="userEmailDisplay">usuario</span>
                <button onclick="logout()">Cerrar Sesión</button>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="stat-card full-width">
                <div class="stat-label">Total Mes Ingresado</div>
                <div class="stat-value" id="lblTotal">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Pagado</div>
                <div class="stat-value" id="lblPaid" style="color: var(--success);">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Restante a Pagar</div>
                <div class="stat-value" id="lblRemaining" style="color: var(--danger);">$0.00</div>
            </div>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-circle-plus" style="color:var(--primary)"></i> Nuevo Gasto</h3>
            <form id="expenseForm">
                <div class="form-group full">
                    <label for="name">Concepto</label>
                    <input type="text" id="name" required placeholder="Ej: Alquiler, Luz">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="totalAmount">Monto Total ($)</label>
                        <input type="number" step="0.01" id="totalAmount" required placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="category">Categoría</label>
                        <select id="category">
                            <option value="Tarjeta">Tarjeta</option>
                            <option value="Impuesto/Servicio">Impuesto/Servicio</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Registrar Gasto</button>
            </form>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-list-check" style="color:var(--primary)"></i> Mis Gastos</h3>
            <div id="expensesList"></div>
        </div>
    </div>
</div>

<script>
    let currentUser = null;

    const authScreen = document.getElementById('auth-screen');
    const appScreen = document.getElementById('app-screen');
    const authForm = document.getElementById('authForm');
    const userEmailDisplay = document.getElementById('userEmailDisplay');

    // Comprobar si ya había una sesión abierta en este dispositivo
    const savedUser = localStorage.getItem('current_user');
    if (savedUser) {
        loginUser(savedUser);
    }

    authForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = document.getElementById('authEmail').value.trim().toLowerCase();
        
        // Guardamos la sesión activa en el navegador
        localStorage.setItem('current_user', username);
        loginUser(username);
    });

    function loginUser(username) {
        currentUser = username;
        userEmailDisplay.textContent = username;
        authScreen.classList.add('hidden');
        appScreen.classList.remove('hidden');
        loadExpenses();
    }

    function logout() {
        localStorage.removeItem('current_user');
        currentUser = null;
        appScreen.classList.add('hidden');
        authScreen.classList.remove('hidden');
        document.getElementById('authForm').reset();
    }

    // Obtener la clave única de almacenamiento para este usuario específico
    function getUserKey() {
        return 'expenses_' + currentUser;
    }

    const expenseForm = document.getElementById('expenseForm');
    expenseForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!currentUser) return;

        const name = document.getElementById('name').value;
        const totalAmount = parseFloat(document.getElementById('totalAmount').value);
        const category = document.getElementById('category').value;

        const newExpense = {
            id: Date.now().toString(),
            name,
            totalAmount,
            paidAmount: 0,
            category
        };

        let expenses = JSON.parse(localStorage.getItem(getUserKey())) || [];
        expenses.unshift(newExpense);
        localStorage.setItem(getUserKey(), JSON.stringify(expenses));

        expenseForm.reset();
        document.getElementById('name').focus();
        loadExpenses();
    });

    function loadExpenses() {
        if (!currentUser) return;
        let expenses = JSON.parse(localStorage.getItem(getUserKey())) || [];
        renderApp(expenses);
    }

    function renderApp(expenses) {
        const expensesList = document.getElementById('expensesList');
        const lblTotal = document.getElementById('lblTotal');
        const lblPaid = document.getElementById('lblPaid');
        const lblRemaining = document.getElementById('lblRemaining');

        expensesList.innerHTML = '';

        let total = 0;
        let paid = 0;

        if (expenses.length === 0) {
            expensesList.innerHTML = '<div class="empty-state">No hay registros cargados para este usuario.</div>';
            lblTotal.textContent = '$0.00';
            lblPaid.textContent = '$0.00';
            lblRemaining.textContent = '$0.00';
            return;
        }

        expenses.forEach(exp => {
            total += exp.totalAmount;
            paid += exp.paidAmount;
            const remaining = exp.totalAmount - exp.paidAmount;
            const isPaid = remaining <= 0.01;

            const div = document.createElement('div');
            div.className = `expense-item ${isPaid ? 'paid' : ''}`;
            div.innerHTML = `
                <div class="expense-header">
                    <span class="expense-title">${exp.name}</span>
                    <span class="expense-category">${exp.category}</span>
                </div>
                <div class="expense-body">
                    Total: <b>$${exp.totalAmount.toFixed(2)}</b> | Pagado: <b>$${exp.paidAmount.toFixed(2)}</b><br>
                    Restante: <b>$${remaining.toFixed(2)}</b>
                </div>
                <div class="actions">
                    <button class="btn-success" onclick="togglePay('${exp.id}')">${isPaid ? 'Desmarcar' : 'Pagar Total'}</button>
                    <button class="btn-danger" onclick="deleteExpense('${exp.id}')">Eliminar</button>
                </div>
            `;
            expensesList.appendChild(div);
        });

        lblTotal.textContent = `$${total.toFixed(2)}`;
        lblPaid.textContent = `$${paid.toFixed(2)}`;
        lblRemaining.textContent = `$${(total - paid).toFixed(2)}`;
    }

    function togglePay(id) {
        let expenses = JSON.parse(localStorage.getItem(getUserKey())) || [];
        expenses = expenses.map(exp => {
            if (exp.id === id) {
                exp.paidAmount = (exp.paidAmount === exp.totalAmount) ? 0 : exp.totalAmount;
            }
            return exp;
        });
        localStorage.setItem(getUserKey(), JSON.stringify(expenses));
        loadExpenses();
    }

    function deleteExpense(id) {
        if (confirm('¿Eliminar este gasto?')) {
            let expenses = JSON.parse(localStorage.getItem(getUserKey())) || [];
            expenses = expenses.filter(exp => exp.id !== id);
            localStorage.setItem(getUserKey(), JSON.stringify(expenses));
            loadExpenses();
        }
    }
</script>

</body>
</html>

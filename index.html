<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Gastos</title>
  
  <!-- Enlace obligatorio al Manifiesto -->
  <link rel="manifest" href="./manifest.json">
  
  <!-- Color de barra de navegación en dispositivos móviles -->
  <meta name="theme-color" content="#6366f1">

  <!-- Estilos CSS integrados para una interfaz moderna y limpia -->
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.75rem;
      color: var(--primary);
    }

    .card {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      margin-bottom: 20px;
    }

    .balance-card {
      text-align: center;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: white;
    }

    .balance-card h2 {
      font-size: 2rem;
      margin-top: 8px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .transaction-list {
      list-style: none;
      max-height: 250px;
      overflow-y: auto;
    }

    .transaction-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .transaction-item:last-child {
      border-bottom: none;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 1.25rem;
      padding: 0 5px;
      width: auto;
    }

    .delete-btn:hover {
      color: #dc2626;
      background: none;
    }

    .empty-msg {
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
      padding: 10px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Control de Gastos</h1>
    </header>

    <!-- Tarjeta de Balance Total -->
    <div class="card balance-card">
      <p>Gastos Totales</p>
      <h2 id="total-amount">$0.00</h2>
    </div>

    <!-- Formulario para agregar gastos -->
    <div class="card">
      <form id="expense-form">
        <div class="form-group">
          <label for="expense-name">Descripción del gasto</label>
          <input type="text" id="expense-name" placeholder="Ej. Supermercado, luz..." required>
        </div>
        <div class="form-group">
          <label for="expense-amount">Monto ($)</label>
          <input type="number" id="expense-amount" step="0.01" placeholder="0.00" required>
        </div>
        <button type="submit">Agregar Gasto</button>
      </form>
    </div>

    <!-- Lista de transacciones -->
    <div class="card">
      <h3 style="margin-bottom: 12px; font-size: 1.1rem;">Historial</h3>
      <ul id="transaction-list" class="transaction-list">
        <p class="empty-msg">No hay gastos registrados.</p>
      </ul>
    </div>
  </div>

  <!-- Lógica de la aplicación y registro del Service Worker -->
  <script>
    // --- 1. Lógica de la aplicación de Gastos ---
    const expenseForm = document.getElementById('expense-form');
    const expenseNameInput = document.getElementById('expense-name');
    const expenseAmountInput = document.getElementById('expense-amount');
    const transactionList = document.getElementById('transaction-list');
    const totalAmountElement = document.getElementById('total-amount');

    // Cargar gastos guardados en el navegador (LocalStorage)
    let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

    function saveAndRender() {
      localStorage.setItem('expenses', JSON.stringify(expenses));
      renderExpenses();
    }

    function renderExpenses() {
      transactionList.innerHTML = '';
      
      if (expenses.length === 0) {
        transactionList.innerHTML = '<p class="empty-msg">No hay gastos registrados.</p>';
        totalAmountElement.innerText = '$0.00';
        return;
      }

      let total = 0;
      expenses.forEach((expense, index) => {
        total += expense.amount;

        const li = document.createElement('li');
        li.classList.add('transaction-item');
        li.innerHTML = `
          <span>${expense.name}</span>
          <div>
            <strong>$${expense.amount.toFixed(2)}</strong>
            <button class="delete-btn" onclick="deleteExpense(${index})">&times;</button>
          </div>
        `;
        transactionList.appendChild(li);
      });

      totalAmountElement.innerText = `$${total.toFixed(2)}`;
    }

    expenseForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const name = expenseNameInput.value.trim();
      const amount = parseFloat(expenseAmountInput.value);

      if (name && !isNaN(amount)) {
        expenses.push({ name, amount });
        expenseNameInput.value = '';
        expenseAmountInput.value = '';
        saveAndRender();
      }
    });

    window.deleteExpense = function(index) {
      expenses.splice(index, 1);
      saveAndRender();
    };

    // Inicializar visualización al cargar
    renderExpenses();

    // --- 2. Registro del Service Worker para PWA ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker registrado correctamente.'))
        .catch((error) => console.log('Error al registrar el Service Worker:', error));
    }
  </script>
</body>
</html>
